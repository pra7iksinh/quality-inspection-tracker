services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qit
      POSTGRES_PASSWORD: qit_secret
      POSTGRES_DB: qit
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qit -d qit"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./api:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://qit:qit_secret@db:5432/qit
      JWT_SECRET: dev-only-jwt-secret-change-in-prod
      SAP_WEBHOOK_SECRET: sap-demo-secret
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"